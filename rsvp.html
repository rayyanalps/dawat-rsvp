<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>You’re invited</title><link rel="stylesheet" href="/style.css"></head>
<body><div class="wrap"><div class="card" id="f">Loading…</div></div>
<script>
var T=location.pathname.split("/").pop(),D,A,G,F=[["nonveg","Non-veg (halal)"],["veg","Vegetarian"],["kids","Kids meal"],["special","Special diet or allergy"]],err="",done=false;
function e(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function st(k,v,l){return'<div class="step"><span>'+(l||"")+'</span><div><button data-k="'+k+'" data-d="-1" aria-label="Fewer">−</button><b>'+v+'</b><button data-k="'+k+'" data-d="1" aria-label="More">+</button></div></div>'}
function draw(){var h;
 if(done){h='<h2>Thank you, '+e(D.name)+'!</h2><p class="sub">'+(A==="yes"?"We’ve noted "+G+" guest"+(G>1?"s":"")+". See you there.":"We’ll miss you.")+'</p><button class="sec" id="ed">Change my answer</button>'}
 else{h='<h2>'+e(D.name)+', you’re invited</h2><p class="sub">'+D.invited+' seat'+(D.invited>1?"s are":" is")+' reserved for you.</p><div class="two"><button class="'+(A==="yes"?"":"sec")+'" data-a="yes">Attending</button><button class="'+(A==="no"?"":"sec")+'" data-a="no">Not attending</button></div>';
 if(A==="yes"){h+='<label>How many are coming?</label>'+st("going",G)+'<label>Which functions?</label>'+D.allFns.map(function(f){return'<label class="chk"><input type="checkbox" data-f="'+e(f)+'"'+(X.indexOf(f)>-1?" checked":"")+'>'+e(f)+'</label>'}).join("")+'<label>Food for each guest</label>'+F.map(function(x){return st(x[0],FD[x[0]],x[1])}).join("")}
 h+=(err?'<div class="err">'+e(err)+'</div>':"")+'<button class="full" id="go">Send my RSVP</button>'}
 document.getElementById("f").innerHTML=h}
var X=[],FD={};
fetch("/api/rsvp/"+T).then(function(r){return r.json()}).then(function(d){if(d.error){document.getElementById("f").textContent=d.error;return}
 D=d;A=d.status==="no"?"no":"yes";G=d.going||d.invited;X=d.fns.length?d.fns.slice():d.allFns.slice();F.forEach(function(x){FD[x[0]]=(d.food&&d.food[x[0]])||0});
 if(!F.some(function(x){return FD[x[0]]>0}))FD.nonveg=G;draw()});
document.addEventListener("click",function(ev){var t=ev.target.closest("button");if(!t||!D)return;err="";
 if(t.dataset.a){A=t.dataset.a}
 else if(t.dataset.k){var k=t.dataset.k,d=+t.dataset.d;if(k==="going")G=Math.max(1,Math.min(D.invited,G+d));else FD[k]=Math.max(0,FD[k]+d)}
 else if(t.id==="ed"){done=false}
 else if(t.id==="go"){var b=A==="yes"?{status:"yes",going:G,fns:X,food:FD}:{status:"no"};
  fetch("/api/rsvp/"+T,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(b)}).then(function(r){return r.json()}).then(function(j){if(j.error)err=j.error;else done=true;draw()});return}
 draw()});
document.addEventListener("change",function(ev){var f=ev.target.dataset&&ev.target.dataset.f;if(f){var i=X.indexOf(f);if(ev.target.checked&&i<0)X.push(f);if(!ev.target.checked&&i>-1)X.splice(i,1)}});
</script></body></html>
