<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dawat RSVP</title>
<style>
:root{--bg:#faf8f4;--card:#fff;--ink:#1b1712;--mute:#6f675c;--line:#e4ded3;--acc:#e0912a;--yes:#2f7d4f;--no:#b64a3a;--wait:#a39a8a}
@media (prefers-color-scheme:dark){:root{--bg:#15130f;--card:#1f1c17;--ink:#f3eee5;--mute:#a79f90;--line:#38332b;--yes:#5cc08a;--no:#e27a69;--wait:#7c7466}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 48px}
h1,h2,.big{font-family:Georgia,serif;margin:0;letter-spacing:-.02em}h1{font-size:28px}h2{font-size:20px;margin-bottom:10px}
.sub{color:var(--mute);margin:4px 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.big{font-size:56px;line-height:1}
.row,.g{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.row:first-of-type,.g:first-child{border-top:0}
.g b{display:block}.g small{color:var(--mute)}.num{font-weight:700;font-size:18px}
.bar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--line);margin:12px 0}.bar i{display:block}
.plan{background:var(--acc);color:#1b1712;border-radius:12px;padding:12px 14px;margin-top:12px;font-weight:600}.plan small{display:block;font-weight:400}
button,a.btn{border:0;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
.sm{padding:6px 10px;font-size:14px}.wa{background:#1f9d55;color:#fff}.full{width:100%;margin-top:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:99px;font-weight:400;font-size:14px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg)}
label{display:block;font-weight:600;margin:12px 0 4px}
input,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tag{font-size:13px;font-weight:600;border:1px solid;border-radius:99px;padding:2px 9px;white-space:nowrap}
.yes{color:var(--yes)}.no{color:var(--no)}.pending{color:var(--wait)}
.step{display:flex;justify-content:space-between;align-items:center;padding:6px 0}
.step div{display:flex;align-items:center;gap:12px}
.step button{width:36px;height:36px;border-radius:50%;padding:0;background:var(--card);color:var(--ink);border:1px solid var(--line);font-size:20px}
.chk{display:flex;gap:8px;align-items:center;font-weight:400}.chk input{width:auto}
.err{color:var(--no);font-weight:600;margin:8px 0}.ok{color:var(--yes);font-weight:600;margin:8px 0}
pre{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:13px;word-break:break-word}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
var FOODS=[["nonveg","Non-veg (halal)"],["veg","Vegetarian"],["kids","Kids meal"],["special","Special diet or allergy"]];
var K="dawat-single-v1",S={host:"",fns:["Mehendi","Nikah","Walima"],hh:[]},cur="All",app=document.getElementById("app");
function $(i){return document.getElementById(i)}
function e(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function enc(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function dec(s){s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";return JSON.parse(decodeURIComponent(escape(atob(s))))}
function wa(phone,text){return"https://wa.me/91"+String(phone).replace(/\D/g,"").slice(-10)+"?text="+encodeURIComponent(text)}
function copy(t,btn){var ok=function(){if(btn)btn.textContent="Copied"};try{navigator.clipboard.writeText(t).then(ok,function(){prompt("Copy this",t)})}catch(x){prompt("Copy this",t)}}

var m=location.hash.match(/^#i=([\w-]+)/),P=null;
if(m){try{P=dec(m[1])}catch(x){}}
if(m&&P&&P.id&&P.h)guest();else if(m)app.innerHTML='<div class="card">This invite link looks incomplete. Please ask the host to send it again.</div>';else host();

/* ---------- guest ---------- */
function guest(){
 var A="yes",G=P.c,X=P.f.slice(),FD={nonveg:P.c,veg:0,kids:0,special:0},err="",done=null;
 function st(k,v,l){return'<div class="step"><span>'+(l||"")+'</span><div><button data-k="'+k+'" data-d="-1" aria-label="Fewer">−</button><b>'+v+'</b><button data-k="'+k+'" data-d="1" aria-label="More">+</button></div></div>'}
 function draw(){var h;
  if(done){h='<h2>Almost done, '+e(P.n)+'</h2><p class="sub">Tap below and press send in WhatsApp. That is how your answer reaches the host.</p><a class="btn wa full" style="text-align:center" href="'+e(done.url)+'">Send on WhatsApp</a><pre>'+e(done.msg)+'</pre><button class="sec full" id="ed">Change my answer</button>';app.innerHTML='<div class="wrap" style="padding:0"><div class="card">'+h+'</div></div>';return}
  h='<h2>'+e(P.n)+', you’re invited</h2><p class="sub">'+P.c+' seat'+(P.c>1?"s are":" is")+' reserved for you.</p><div class="two"><button class="'+(A==="yes"?"":"sec")+'" data-a="yes">Attending</button><button class="'+(A==="no"?"":"sec")+'" data-a="no">Not attending</button></div>';
  if(A==="yes")h+='<label>How many are coming?</label>'+st("going",G)+'<label>Which functions?</label>'+P.f.map(function(f){return'<label class="chk"><input type="checkbox" data-f="'+e(f)+'"'+(X.indexOf(f)>-1?" checked":"")+'>'+e(f)+'</label>'}).join("")+'<label>Food for each guest</label>'+FOODS.map(function(x){return st(x[0],FD[x[0]],x[1])}).join("");
  h+=(err?'<div class="err">'+e(err)+'</div>':"")+'<button class="full" id="go">Continue to WhatsApp</button>';
  app.innerHTML='<div class="card">'+h+'</div>'}
 app.onclick=function(ev){var t=ev.target.closest("button");if(!t)return;err="";
  if(t.dataset.a)A=t.dataset.a;
  else if(t.dataset.k){var k=t.dataset.k,d=+t.dataset.d;if(k==="going")G=Math.max(1,Math.min(P.c,G+d));else FD[k]=Math.max(0,FD[k]+d)}
  else if(t.id==="ed")done=null;
  else if(t.id==="go"){var r;
   if(A==="yes"){var tot=FOODS.reduce(function(a,x){return a+FD[x[0]]},0);
    if(!X.length){err="Pick at least one function."}
    else if(tot!==G){err="Food choices add up to "+tot+" but "+G+" are coming. Make them match."}
    else r={id:P.id,y:1,g:G,f:X,d:FD}}
   else r={id:P.id,y:0};
   if(r){var msg="Assalamu alaikum! RSVP from "+P.n+": "+(r.y?"attending ("+G+" of "+P.c+"). Functions: "+X.join(", ")+". Food: "+FOODS.filter(function(x){return FD[x[0]]>0}).map(function(x){return x[1]+" "+FD[x[0]]}).join(", ")+".":"unable to attend.")+"\n\nDAWAT:"+enc(r);
    done={msg:msg,url:wa(P.h,msg)};try{location.href=done.url}catch(x){}}}
  draw()};
 app.onchange=function(ev){var f=ev.target.dataset&&ev.target.dataset.f;if(f){var i=X.indexOf(f);if(ev.target.checked&&i<0)X.push(f);if(!ev.target.checked&&i>-1)X.splice(i,1)}};
 draw()}

/* ---------- host ---------- */
function host(){
 try{var r=localStorage.getItem(K);if(r)S=JSON.parse(r)}catch(x){}
 function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(x){}}
 function inF(h){return cur==="All"||h.fns.indexOf(cur)>-1}
 function stats(){var r={inv:0,conf:0,no:0,wait:0,food:{nonveg:0,veg:0,kids:0,special:0}};
  S.hh.forEach(function(h){r.inv+=h.c;if(h.status==="pending")r.wait+=h.c;else if(h.status==="yes"&&inF(h)){r.conf+=h.going;for(var k in r.food)r.food[k]+=(h.food[k]||0)}else r.no+=h.c});
  r.exp=r.conf+Math.round(r.wait*.4);return r}
 function link(h){return location.origin+location.pathname+"#i="+enc({id:h.id,n:h.n,c:h.c,f:S.fns,h:S.host})}
 function msg(h){return"Assalamu alaikum "+h.n+"! Please confirm if you can join us, it helps us plan food and seating: "+link(h)}
 var note="",nerr="";
 function draw(){var s=stats(),p=function(n){return(s.inv?n/s.inv*100:0)+"%"};
  app.innerHTML='<h1>Dawat RSVP</h1><p class="sub">Made for Muslim weddings in Bangalore. Know who’s coming before the caterer asks.</p>'+
  (location.protocol==="file:"?'<div class="card err">Upload this file to GitHub and open it from its web address first. Invite links made from a file on your computer will not work for guests.</div>':"")+
  '<div class="card"><h2>1. Your WhatsApp number</h2><p class="sub" style="margin-top:0">Guests send their answers here.</p><input id="hp" inputmode="tel" placeholder="98450 12345" value="'+e(S.host)+'" aria-label="Your WhatsApp number"></div>'+
  '<div class="chips">'+["All"].concat(S.fns).map(function(f){return'<button class="chip" data-f="'+e(f)+'" aria-pressed="'+(f===cur)+'">'+(f==="All"?"All functions":e(f))+'</button>'}).join("")+'</div>'+
  '<div class="card"><div class="sub" style="margin:0">Total invited</div><div class="big">'+s.inv+'</div><div class="bar"><i style="width:'+p(s.conf)+';background:var(--yes)"></i><i style="width:'+p(s.no)+';background:var(--no)"></i><i style="width:'+p(s.wait)+';background:var(--wait)"></i></div>'+
  '<div class="row"><span>Confirmed</span><span class="num">'+s.conf+'</span></div><div class="row"><span>Not attending</span><span class="num">'+s.no+'</span></div><div class="row"><span>Awaiting response</span><span class="num">'+s.wait+'</span></div>'+
  '<div class="plan">Plan for '+s.exp+' guests<small>'+s.conf+' confirmed plus about 40% of the '+s.wait+' who haven’t replied. RSVPs are estimates, so keep a small buffer.</small></div></div>'+
  '<div class="card"><h2>Food for the caterer</h2>'+FOODS.map(function(x){return'<div class="row"><span>'+x[1]+'</span><span class="num">'+s.food[x[0]]+'</span></div>'}).join("")+'<button class="sec full" id="sheet">Copy caterer sheet</button></div>'+
  '<div class="card"><h2>2. Guest households</h2>'+(S.hh.map(function(h){var t=h.status==="yes"?"Coming ("+h.going+")":h.status==="no"?"Can’t come":"No reply";
   return'<div class="g"><div><b>'+e(h.n)+'</b><small>'+h.c+' invited'+(h.status==="yes"?" · "+h.fns.map(e).join(", "):"")+'</small></div><div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center"><span class="tag '+h.status+'">'+t+'</span><a class="btn wa sm" target="_blank" rel="noopener" data-s="'+h.id+'" href="'+e(wa(h.p,msg(h)))+'">'+(h.sent?"Resend":"Invite")+'</a><button class="sec sm" data-c="'+h.id+'">Copy link</button><button class="sec sm" data-x="'+h.id+'" aria-label="Delete '+e(h.n)+'">✕</button></div></div>'}).join("")||'<p class="sub">No households yet. Add your first one below.</p>')+
  '<label for="n">Name</label><input id="n" placeholder="Siddiqui family"><div class="two"><div><label for="p">Their WhatsApp number</label><input id="p" inputmode="tel" placeholder="98450 12345"></div><div><label for="c">People invited</label><input id="c" type="number" min="1" max="30" value="4"></div></div>'+
  '<div class="err" id="ae">'+e(nerr)+'</div><button class="full" id="add">Add household</button></div>'+
  '<div class="card"><h2>3. Add guest replies</h2><p class="sub" style="margin-top:0">When guests reply on WhatsApp, long-press their messages, copy them, and paste here. Each reply updates the dashboard.</p><textarea id="rp" rows="4" placeholder="Paste replies here" aria-label="Paste guest replies"></textarea>'+(note?'<div class="ok">'+e(note)+'</div>':"")+'<button class="full" id="ap">Update dashboard</button></div>'+
  '<div class="card"><h2>Your functions</h2><p class="sub" style="margin-top:0">Tap to remove. Add whatever your family holds.</p><div class="chips">'+S.fns.map(function(f){return'<button class="chip" data-rf="'+e(f)+'">'+e(f)+' ✕</button>'}).join("")+'</div><div class="two"><input id="nf" placeholder="e.g. Dholki" maxlength="24" aria-label="New function"><button id="addf">Add function</button></div><p class="sub">Guests see the functions as they were when you made their link.</p></div>'}
 app.onclick=function(ev){var t=ev.target.closest("button,a");if(!t)return;
  if(t.dataset.s){var h=S.hh.find(function(x){return x.id===t.dataset.s});if(!S.host){ev.preventDefault();nerr="Enter your own WhatsApp number at the top first.";draw();return}h.sent=1;save();setTimeout(draw,300);return}
  if(t.dataset.f){cur=t.dataset.f;draw()}
  else if(t.dataset.c){if(!S.host){nerr="Enter your own WhatsApp number at the top first.";draw();return}copy(link(S.hh.find(function(x){return x.id===t.dataset.c})),t)}
  else if(t.dataset.x){if(confirm("Delete this household?")){S.hh=S.hh.filter(function(x){return x.id!==t.dataset.x});save();draw()}}
  else if(t.dataset.rf){if(S.fns.length>1){S.fns=S.fns.filter(function(f){return f!==t.dataset.rf});S.hh.forEach(function(h){h.fns=h.fns.filter(function(f){return f!==t.dataset.rf})});if(cur===t.dataset.rf)cur="All";save();draw()}}
  else if(t.id==="addf"){var v=$("nf").value.trim();if(v&&S.fns.indexOf(v)<0&&S.fns.length<8){S.fns.push(v);save();draw()}}
  else if(t.id==="add"){var n=$("n").value.trim(),ph=$("p").value.replace(/\D/g,"").slice(-10),c=parseInt($("c").value,10);
   if(!S.host){nerr="Enter your own WhatsApp number at the top first.";draw();return}
   if(!n||ph.length!==10||!(c>0&&c<=30)){nerr="Need a name, a 10-digit number and 1 to 30 people.";draw();return}
   nerr="";S.hh.push({id:Math.random().toString(36).slice(2,9),n:n,p:ph,c:c,status:"pending",going:0,fns:[],food:{}});save();draw()}
  else if(t.id==="ap"){var re=/DAWAT:([\w-]+)/g,mm,k=0;
   while((mm=re.exec($("rp").value))){try{var r=dec(mm[1]),h2=S.hh.find(function(x){return x.id===r.id});if(h2){h2.status=r.y?"yes":"no";h2.going=r.y?r.g:0;h2.fns=r.y?r.f:[];h2.food=r.y?r.d:{};k++}}catch(x){}}
   note=k?k+" repl"+(k>1?"ies":"y")+" added.":"No valid replies found. Paste the full message including the DAWAT code.";save();draw()}
  else if(t.id==="sheet"){var s=stats();copy("Caterer sheet - "+(cur==="All"?"all functions":cur)+"\nConfirmed: "+s.conf+"\nNot yet replied: "+s.wait+"\nSuggested plan: "+s.exp+"\n\n"+FOODS.map(function(x){return x[1]+": "+s.food[x[0]]}).join("\n"),t)}};
 app.onchange=function(ev){if(ev.target.id==="hp"){S.host=ev.target.value.replace(/\D/g,"").slice(-10);save();nerr="";draw()}};
 draw()}
</script>
</body>
</html>
